<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>레이싱 인라인 매물판</title>
<meta name="theme-color" content="#1f4fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인라인매물">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-first column — a sticky lane-striped filter bar over a stack of listing rows */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#141a24; --muted:#5d6878; --line:#dde2ea;
  --accent:#1f4fd6; --accent-ink:#ffffff; --lane:#f2b705;
  --good:#127a46; --good-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d6;
  --cafe:#5b3fb8; --cafe-bg:#ece7fb; --bad:#a3303a; --bad-bg:#f9e4e6;
  --font-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --fg:#e8edf4; --muted:#97a3b4; --line:#273142;
  --accent:#6f95ff; --accent-ink:#0b1020; --lane:#f2c230;
  --good:#5fd394; --good-bg:#14301f; --warn:#f1b955; --warn-bg:#33270f;
  --cafe:#b5a2ff; --cafe-bg:#251d42; --bad:#f08a93; --bad-bg:#3a1a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --fg:#e8edf4; --muted:#97a3b4; --line:#273142;
  --accent:#6f95ff; --accent-ink:#0b1020; --lane:#f2c230;
  --good:#5fd394; --good-bg:#14301f; --warn:#f1b955; --warn-bg:#33270f;
  --cafe:#b5a2ff; --cafe-bg:#251d42; --bad:#f08a93; --bad-bg:#3a1a1e; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header h1{font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:.01em;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.lane{height:6px;margin:14px 0 0;background:repeating-linear-gradient(90deg,var(--lane) 0 28px,transparent 28px 44px);border-radius:3px;opacity:.9}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .n{opacity:.7;font-weight:500;margin-left:3px}
.toggle{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.status{font-size:12px;color:var(--muted);min-height:18px;margin:10px 0 0}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.item.is-hidden{opacity:.55}
.main{min-width:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.02em}
.pill.good{color:var(--good);background:var(--good-bg)} .pill.unknown{color:var(--warn);background:var(--warn-bg)}
.pill.cafe{color:var(--cafe);background:var(--cafe-bg)} .pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.new{color:var(--accent-ink);background:var(--accent)}
.site{font-weight:600;color:var(--fg)}
.title{display:block;margin-top:4px;font-weight:600;font-size:15px;color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
.title:hover{text-decoration:underline}
.note{margin:4px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{font-family:var(--font-mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.size{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.acts{display:flex;gap:4px}
.btn{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 8px;cursor:pointer}
.btn[aria-pressed="true"]{color:var(--lane);border-color:var(--lane)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px 18px;color:var(--muted);text-align:center}
footer{margin-top:24px;font-size:12px;color:var(--muted)}
@media (max-width:420px){.item{grid-template-columns:1fr}.side{flex-direction:row;align-items:center;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.refresh{margin-left:auto}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>레이싱 인라인 매물판</h1>
    <p>220 · 225 · 230mm · 시티런 · S부츠 · 솔베인 · 센텀 · 당근 / 중고나라 / 인라인파크</p>
    <div class="lane" aria-hidden="true"></div>
  </header>

  <div class="bar">
    <div class="row" id="sizeRow" role="group" aria-label="사이즈"></div>
    <div class="row" id="catRow" role="group" aria-label="분류"></div>
    <div class="row">
      <button class="chip" id="favOnly" aria-pressed="false" type="button">★ 관심만</button>
      <label class="toggle"><input type="checkbox" id="showHidden"> 숨긴 매물 보기</label>
    </div>
  </div>

  <div class="status"><span id="status">매물 불러오는 중…</span><button class="btn refresh" id="refresh" type="button">새로고침</button></div>
  <div class="list" id="list">
    <div class="empty">자동 검색이 찾은 매물이 여기에 쌓여요. 3시간마다(8시~23시) 새 매물이 추가됩니다.</div>
  </div>

  <footer>매물 제목을 누르면 당근·중고나라·카페 글이 열려요. 인라인파크 글 본문은 카페 준회원 이상만 볼 수 있어요. ★와 숨기기는 이 휴대폰에만 저장돼요.</footer>
</div>

<script>
(function(){
  const SIZES=["전체","220","225","230"];
  const CATS=[["all","전체"],["good","추천"],["unknown","확인 필요"],["cafe","카페"],["bad","제외"]];
  const LABEL={good:"추천",unknown:"확인 필요",cafe:"카페 · 제목만",bad:"제외"};
  const state={size:"전체",cat:"all",fav:false,showHidden:false,items:[],ready:false,marks:{}};
  const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")||d;}catch(e){return d;}};
  const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  Object.assign(state,load("rib-filters",{}));
  state.marks=load("rib-marks",{});
  const $=id=>document.getElementById(id);

  function save(){store("rib-filters",{size:state.size,cat:state.cat,fav:state.fav,showHidden:state.showHidden});}
  const mark=(it,f)=>!!(state.marks[it.id]||{})[f];
  function matchSize(it){return state.size==="전체"||(it.sizes||[]).map(String).includes(state.size);}
  function visible(it){return (state.showHidden||!mark(it,"hidden"))&&(!state.fav||mark(it,"fav"))&&matchSize(it);}
  function isNew(it){const t=Date.parse(it.found||"");return t&&Date.now()-t<36*3600e3;}
  function won(n){return typeof n==="number"?n.toLocaleString("ko-KR")+"원":"가격 미표기";}

  function chips(){
    const base=state.items.filter(it=>(state.showHidden||!mark(it,"hidden"))&&(!state.fav||mark(it,"fav")));
    $("sizeRow").replaceChildren(...SIZES.map(s=>{const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",String(state.size===s));
      const n=base.filter(it=>s==="전체"||(it.sizes||[]).map(String).includes(s)).filter(it=>state.cat==="all"||it.status===state.cat).length;
      b.textContent=s==="전체"?"전체":s+"mm";const sp=document.createElement("span");sp.className="n";sp.textContent=n;b.append(sp);
      b.onclick=()=>{state.size=s;save();render();};return b;}));
    $("catRow").replaceChildren(...CATS.map(([k,l])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",String(state.cat===k));
      const n=base.filter(matchSize).filter(it=>k==="all"||it.status===k).length;
      b.textContent=l;const sp=document.createElement("span");sp.className="n";sp.textContent=n;b.append(sp);
      b.onclick=()=>{state.cat=k;save();render();};return b;}));
    $("favOnly").setAttribute("aria-pressed",String(state.fav));
    $("showHidden").checked=state.showHidden;
  }

  function toggle(it,f){const m=state.marks[it.id]||{};m[f]=!m[f];state.marks[it.id]=m;store("rib-marks",state.marks);render();}

  function row(it){
    const hid=mark(it,"hidden"),fav=mark(it,"fav");
    const el=document.createElement("article");el.className="item"+(hid?" is-hidden":"");
    const main=document.createElement("div");main.className="main";
    const meta=document.createElement("div");meta.className="meta";
    const p=document.createElement("span");p.className="pill "+(LABEL[it.status]?it.status:"unknown");p.textContent=LABEL[it.status]||"확인 필요";meta.append(p);
    if(isNew(it)){const n=document.createElement("span");n.className="pill new";n.textContent="NEW";meta.append(n);}
    const site=document.createElement("span");site.className="site";site.textContent=it.site||"";meta.append(site);
    if(it.brand){const b=document.createElement("span");b.textContent="· "+it.brand;meta.append(b);}
    if(it.posted){const d=document.createElement("span");d.textContent="· "+it.posted;meta.append(d);}
    const a=document.createElement("a");a.className="title";a.target="_blank";a.rel="noopener";a.textContent=it.title||"(제목 없음)";
    if(/^https:\/\//.test(it.url||""))a.href=it.url;
    main.append(meta,a);
    if(it.note){const n=document.createElement("p");n.className="note";n.textContent=it.note;main.append(n);}
    const side=document.createElement("div");side.className="side";
    const info=document.createElement("div");info.style.cssText="display:flex;flex-direction:column;align-items:flex-end";
    const pr=document.createElement("div");pr.className="price";pr.textContent=won(it.price);
    const sz=document.createElement("div");sz.className="size";sz.textContent=(it.size||"")+(it.size&&!/mm/.test(it.size)?"mm":"");
    info.append(pr,sz);
    const acts=document.createElement("div");acts.className="acts";
    const f=document.createElement("button");f.type="button";f.className="btn";f.setAttribute("aria-pressed",String(fav));f.textContent=fav?"★ 관심":"☆ 관심";f.onclick=()=>toggle(it,"fav");
    const h=document.createElement("button");h.type="button";h.className="btn";h.textContent=hid?"다시 보기":"숨기기";h.onclick=()=>toggle(it,"hidden");
    acts.append(f,h);side.append(info,acts);
    el.append(main,side);return el;
  }

  function render(){
    chips();
    if(!state.ready)return;
    const order={good:0,unknown:1,cafe:2,bad:3};
    const list=state.items.filter(visible).filter(it=>state.cat==="all"||it.status===state.cat)
      .sort((a,b)=>(Date.parse(b.found||0)||0)-(Date.parse(a.found||0)||0)||(order[a.status]??9)-(order[b.status]??9));
    if(!list.length){const e=document.createElement("div");e.className="empty";
      e.textContent=state.items.length?"이 조건에 맞는 매물이 아직 없어요. 다른 사이즈나 분류를 눌러 보세요.":"아직 저장된 매물이 없어요. 다음 자동 검색 후에 채워져요.";
      $("list").replaceChildren(e);return;}
    $("list").replaceChildren(...list.map(row));
  }

  async function fetchData(){
    $("status").textContent="매물 불러오는 중…";
    try{
      const r=await fetch("data/listings.json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();
      state.items=Array.isArray(j.items)?j.items:[];state.ready=true;
      const nNew=state.items.filter(i=>isNew(i)&&!mark(i,"hidden")&&i.status!=="bad").length;
      const up=Date.parse(j.updated||"");
      $("status").textContent=`매물 ${state.items.length}개`+(nNew?` · 새 매물 ${nNew}개`:"")+(up?` · 마지막 검색 ${new Date(up).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`:"");
    }catch(e){
      $("status").textContent="매물을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침을 눌러 주세요.";
    }
    render();
  }

  $("favOnly").onclick=()=>{state.fav=!state.fav;save();render();};
  $("showHidden").onchange=e=>{state.showHidden=e.target.checked;save();render();};
  $("refresh").onclick=fetchData;
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")fetchData();});
  render();fetchData();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
